id: 4a698202-6caf-5c8c-908c-5c6168fbcebf
name: SOCRadar MSSP - Alarm Trends
description: |
  'Hourly SOCRadar alarm volume per company over the last 7 days.'
description-detailed: |
  'Buckets the last 7 days of MSSP alarms into hourly windows per company_name and alarm main type.
  Use it to confirm or dismiss a volume spike alert and to see whether a change is customer specific.'
requiredDataConnectors: []
tactics:
  - Discovery
relevantTechniques:
  - T1526
severity: Medium
entityMappings:
  - entityType: Malware
    fieldMappings:
      - identifier: Name
        columnName: AlarmMainType
query: |
  SOCRadar_MSSP_Alarms_CL
  | where TimeGenerated > ago(7d)
  | summarize Count=count() by bin(TimeGenerated, 1h), company_name, AlarmMainType
  | order by TimeGenerated desc
version: 1.0.0
