id: 5325a3a6-4c7d-5b98-b77a-8d0870a1f5d2
name: SOCRadar MSSP - Critical Alarms
description: |
  'HIGH and CRITICAL SOCRadar alarms that were open at import, across every monitored company.'
description-detailed: |
  'Filters the last 30 days of the MSSP alarm table down to HIGH and CRITICAL alarms that were OPEN when imported and keeps company_name on every row so the result can be routed to the right customer. The table keeps the status as it was at import time, so an alarm closed later on SOCRadar still shows here.
  Severity values arrive from SOCRadar in upper case.'
requiredDataConnectors: []
tactics:
  - Impact
relevantTechniques:
  - T1486
severity: High
entityMappings:
  - entityType: Malware
    fieldMappings:
      - identifier: Name
        columnName: AlarmMainType
query: |
  SOCRadar_MSSP_Alarms_CL
  | where TimeGenerated > ago(30d)
  | where Severity in ("HIGH", "CRITICAL")
  | where Status == "OPEN"
  | project TimeGenerated, company_name, AlarmId, Title, AlarmMainType, AlarmSubType, Severity, Status
  | order by TimeGenerated desc
version: 1.0.1
