id: b77d2b56-8fc0-4659-91c9-b7aaf7ea3b4a
name: SOCRadar MSSP — High or Critical Severity Alarm
description: |
  'Detects SOCRadar alarms with High or Critical severity levels that require immediate attention. These alarms typically indicate active threats such as credential exposure, ransomware mentions, or targeted attacks against the organization.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SOCRadarMSSPAlarms
    dataTypes:
      - SOCRadar_MSSP_Alarms_CL
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CredentialAccess
relevantTechniques:
  - T1589
  - T1078
query: |
    SOCRadar_MSSP_Alarms_CL
    | where Severity in ("High", "Critical")
    | where Status == "OPEN"
    | extend AlarmUrl = strcat("https://platform.socradar.com/company/", CompanyId, "/alarms/", AlarmId)
    | extend AccountName = tostring(AlarmId)
    | project TimeGenerated, AlarmId, Title, AlarmMainType, AlarmSubType, Severity, Status, AlarmUrl, AccountName
entityMappings:
  - entityType: Malware
    fieldMappings:
      - identifier: Name
        columnName: AlarmMainType
      - identifier: Category
        columnName: AlarmSubType
  - entityType: URL
    fieldMappings:
      - identifier: Url
        columnName: AlarmUrl
version: 1.0.0
kind: Scheduled
